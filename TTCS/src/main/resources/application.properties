# Trỏ vào database ttcs trên XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/ttcs?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8

# XAMPP mặc định là root và không có mật khẩu
spring.datasource.username=root
spring.datasource.password=

# Cấu hình tự động tạo bảng (Rất quan trọng)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true